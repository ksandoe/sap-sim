version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build -w packages/shared
        - npm run build -w packages/engine
        - VITE_LOCAL_STORAGE_MODE=true npm run build -w apps/web
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
